[project]
name = "blockbrief-etl"
version = "0.1.0"
description = "Load Toronto open datasets from data/raw into Supabase (Postgres + PostGIS)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
bb = "blockbrief_etl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blockbrief_etl"]
